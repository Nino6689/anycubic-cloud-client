name: Publish

# Every release is built and uploaded here from a tagged commit -- never from
# a laptop -- via PyPI trusted publishing, so no token exists anywhere. This is
# what Home Assistant's dependency-transparency rule asks of a requirement.

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The tag must name the version being built
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi
      - name: Tests
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" || pip install -e . pytest pytest-asyncio
          pytest -q
      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      # This library must never carry Anycubic's certificates, keys or app
      # credentials: callers pass them in at runtime (docs/CLEAN-ROOM.md).
      # A match here means someone bundled them -- stop the release.
      - name: No keys or certificates in the wheel
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          bad = [n for n in zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
                 if n.endswith((".key", ".pem", ".crt", ".p12"))]
          if bad:
              print(f"::error::key material in wheel: {bad}")
              sys.exit(1)
          PY
      - uses: pypa/gh-action-pypi-publish@release/v1
